name: Build Custom Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-custom-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Custom Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and Android arm64 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: custom-android-arm64
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Generate self-signed keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/custom.jks" \
            -alias nectarlink \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass custompass -keypass custompass \
            -dname "CN=NectarLink Custom, OU=Dev, O=Custom, L=ID, ST=ID, C=ID"
      - name: Build APK (arm64-v8a)
        working-directory: android
        env:
          NECTARLINK_KEYSTORE: ${{ runner.temp }}/custom.jks
          NECTARLINK_KEYSTORE_PASSWORD: custompass
        run: ./gradlew --no-daemon assembleRelease -Pnectarlink.abis=arm64-v8a
      - name: Package APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Nectarlink-custom-oppo-fix-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nectarlink-custom-oppo-fix-android
          path: out/Nectarlink-custom-oppo-fix-android.apk
